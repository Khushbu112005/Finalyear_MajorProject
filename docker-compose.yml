version: '3.8'

services:
  # 1. Primary Relational & Vector DB (PostgreSQL 16 + pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civicsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_dev_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-civicsphere}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicsphere -d civicsphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Statutory Knowledge Graph DB (Neo4j Enterprise / Community 5)
  neo4j:
    image: neo4j:5-community
    container_name: civicsphere-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-civic_neo4j_secret_2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-civic_neo4j_secret_2026}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. High-Speed Cache & Rate Limiting (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: civicsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Object Storage for Verified Documents (MinIO S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: civicsphere-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-civicminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-civic_minio_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 5. Unified FastAPI Backend (Port 8000)
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: civicsphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://civicsphere:${POSTGRES_PASSWORD:-civic_dev_secret_2026}@postgres:5432/civicsphere
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-civic_neo4j_secret_2026}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-civicsphere_prod_jwt_secret_key_32_chars_long!}
      EMBEDDING_PROVIDER: sentence_transformers
      EMBEDDING_DIM: 384
    ports:
      - "8000:8000"

  # 6. Consolidated Next.js Frontend (Port 3000)
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: civicsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data:
