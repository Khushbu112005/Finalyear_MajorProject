# Alembic configuration for CivicSphere AI PostgreSQL Database

[alembic]
script_location = backend/migrations
prepend_sys_path = .
version_path_separator = os

# We load DATABASE_URL dynamically in env.py from backend.app.common.config
sqlalchemy.url = postgresql+asyncpg://civicsphere:civic_dev_secret_2026@localhost:5432/civicsphere

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
