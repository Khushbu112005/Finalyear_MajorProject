name: CivicSphere AI Security & Vulnerability Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1' # Weekly security audit

jobs:
  security-audit:
    name: Security Regression & Secret Scan
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: "civicsphere-ci-test-jwt-secret-key-32-chars-long!"
      NEO4J_PASSWORD: "civicsphere-ci-test-neo4j-password-123!"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Security Regression Suite
        run: |
          python -m pytest -p no:pytest_ethereum backend/tests/security/ -v --tb=short

      - name: Run Secret Leakage & Static Hygiene Check
        run: |
          python -c "from backend.app.common.config import GlobalSettings; print('Config secret checks active')"
