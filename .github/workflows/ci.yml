name: CivicSphere AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Test & Quality Suite
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: "civicsphere-ci-test-jwt-secret-key-32-chars-long!"
      NEO4J_PASSWORD: "civicsphere-ci-test-neo4j-password-123!"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest -p no:pytest_ethereum backend/tests/ packages/schemas/ -v --tb=short

      - name: Run Evaluation Benchmarks Quality Gate
        run: |
          python infrastructure/scripts/run_benchmarks.py

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm install

      - name: Build / Typecheck Frontend
        working-directory: ./apps/web
        run: npm run build
