version: '3.8'

services:
  # 1. Relational Database with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civicsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicsphere
      POSTGRES_USER: civicsphere_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicsphere_secure_db_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicsphere_user -d civicsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Graph Database
  neo4j:
    image: neo4j:5.15.0
    container_name: civicsphere-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-civicsphere_graph_pass_2026}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  # 3. Cache & Rate Limiting
  redis:
    image: redis:7.2-alpine
    container_name: civicsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 4. S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: civicsphere-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 5. Canonical Backend (FastAPI Modular Monolith)
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: civicsphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://civicsphere_user:${POSTGRES_PASSWORD:-civicsphere_secure_db_pass_2026}@postgres:5432/civicsphere
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-civicsphere_graph_pass_2026}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-production-jwt-secret-min-32-chars-long-2026!}
    ports:
      - "8000:8000"

  # 6. Canonical Frontend (Next.js 14 App Router)
  frontend:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: civicsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

  # 7. Continuous Source Synchronization Scheduler Daemon
  sync-cron:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: civicsphere-sync-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://civicsphere_user:${POSTGRES_PASSWORD:-civicsphere_secure_db_pass_2026}@postgres:5432/civicsphere
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-civicsphere_graph_pass_2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-production-jwt-secret-min-32-chars-long-2026!}
    command: ["python", "infrastructure/scripts/sync_sources_cron.py"]

volumes:
  pgdata:
  neo4jdata:
  miniodata:
